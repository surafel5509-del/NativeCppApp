name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # On failure, mirror compiler/test errors into step annotations so they
      # are readable through the Checks API even when raw logs are unavailable.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Failure digest"
            grep -E "(^e: file://|^w: file://|error: |What went wrong|> Task .*FAILED|FAILURE:|FAILED$|tests? completed|expected:|actual:)" "$RUNNER_TEMP/gradle-test.log" \
              | head -60 | cut -c1-400 | while IFS= read -r line; do
                  echo "::error::$line"
                done
            echo "::endgroup::"
          fi
          exit $status

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "(^e: file://|error: |What went wrong|> Task .*FAILED|FAILURE:)" "$RUNNER_TEMP/gradle-assemble.log" \
              | head -60 | cut -c1-400 | while IFS= read -r line; do
                  echo "::error::$line"
                done
          fi
          exit $status

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
